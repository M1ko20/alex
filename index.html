<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alexandra Tomanová</title>
    <meta name="description" content="Paintings and collages by Alexandra Tomanová, 2023–2026. See the works, the artist, and which pieces are available." />
    <meta name="theme-color" content="#f3efea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alexandra Tomanová" />
    <meta property="og:description" content="Paintings and collages, 2023–2026." />
    <meta property="og:image" content="/img/the-creature/01-work-1200.webp" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Netlify Forms: this static copy of the inquiry form lets Netlify detect the
      form at build time. The visible form is rendered by React (InquiryForm.tsx)
      and posts the same fields. Set up email notifications in the Netlify UI:
      Site settings → Forms → Form notifications.
    -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="topic" />
      <input type="text" name="artwork" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
